databaseChangeLog:
  - changeSet:
      id: 002-create-rule-stats-table
      author: skyka
      changes:
        - createTable:
            tableName: rule_stats
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rule_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: count
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: rule_stats
            baseColumnNames: rule_id
            referencedTableName: dynamic_rule
            referencedColumnNames: id
            constraintName: fk_rule_stats_rule
            onDelete: CASCADE