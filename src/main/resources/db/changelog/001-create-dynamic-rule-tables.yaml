databaseChangeLog:
  - changeSet:
      id: 001-create-dynamic-rule-tables
      author: skyka
      changes:
        - createTable:
            tableName: dynamic_rule
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_text
                  type: TEXT
                  constraints:
                    nullable: false

        - createTable:
            tableName: rule_query
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: query_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: negate
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: rule_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: rule_query
            baseColumnNames: rule_id
            referencedTableName: dynamic_rule
            referencedColumnNames: id
            constraintName: fk_rule_query_rule

        - createTable:
            tableName: rule_query_argument
            columns:
              - column:
                  name: rule_query_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: argument
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: rule_query_argument
            baseColumnNames: rule_query_id
            referencedTableName: rule_query
            referencedColumnNames: id
            constraintName: fk_rule_query_argument_query